<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş — DecisionOS</title>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 24rem; margin: 4rem auto;
         padding: 0 1.25rem; color: #1a1a1a; line-height: 1.55; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  p.lede { color: #444; margin-bottom: 2rem; }
  form { background: #f7f7f8; border-radius: 12px; padding: 1.5rem; }
  input { width: 100%; box-sizing: border-box; padding: 0.6rem; margin-bottom: 0.75rem;
    border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  button { width: 100%; padding: 0.75rem 1.5rem; background: #1a1a1a; color: #fff; border: none;
    border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .status { margin-top: 0.75rem; font-size: 0.9rem; }
  .status.error { color: #b00; }
  .status.ok { color: #076; }
  .hidden { display: none; }
  .link { background: none; border: none; color: #666; text-decoration: underline; width: auto;
    padding: 0; margin-top: 0.75rem; font-size: 0.85rem; }
  .muted { color: #777; font-size: 0.9em; }
</style>
</head>
<body>
<h1>Vakalarım</h1>
<p class="lede">Devam eden pazarlığınızın durumunu görmek için e-posta ile giriş yapın.</p>

<form id="request-form">
  <input type="email" name="email" placeholder="E-posta" required autocomplete="email">
  <input type="tel" name="phone" placeholder="Telefon" required autocomplete="tel">
  <input type="text" name="name" placeholder="Ad soyad (opsiyonel)" autocomplete="name">
  <button type="submit">Giriş kodu gönder</button>
  <div id="request-status" class="status"></div>
</form>

<form id="verify-form" class="hidden">
  <p class="muted" id="verify-lede"></p>
  <input type="text" name="code" placeholder="6 haneli kod" inputmode="numeric" maxlength="6" required autocomplete="one-time-code">
  <button type="submit">Giriş yap</button>
  <button type="button" class="link" id="resend-btn">Başka kod iste</button>
  <div id="verify-status" class="status"></div>
</form>

<script>
var requestForm = document.getElementById('request-form');
var verifyForm = document.getElementById('verify-form');
var pendingEmail = null;

requestForm.addEventListener('submit', async function (e) {
  e.preventDefault();
  var status = document.getElementById('request-status');
  var email = requestForm.email.value;
  status.textContent = 'Gönderiliyor...';
  status.className = 'status';
  try {
    var resp = await fetch('/web/auth/request-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: email,
        phone: requestForm.phone.value,
        name: requestForm.name.value || null
      })
    });
    if (!resp.ok) {
      status.textContent = 'Bir şeyler ters gitti, tekrar deneyin.';
      status.className = 'status error';
      return;
    }
    pendingEmail = email;
    document.getElementById('verify-lede').textContent = email + ' adresine bir kod gönderdik.';
    requestForm.classList.add('hidden');
    verifyForm.classList.remove('hidden');
    status.textContent = '';
  } catch (err) {
    status.textContent = 'Bir şeyler ters gitti, tekrar deneyin.';
    status.className = 'status error';
  }
});

verifyForm.addEventListener('submit', async function (e) {
  e.preventDefault();
  var status = document.getElementById('verify-status');
  status.textContent = 'Kontrol ediliyor...';
  status.className = 'status';
  try {
    var resp = await fetch('/web/auth/verify-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: pendingEmail, code: verifyForm.code.value })
    });
    if (!resp.ok) {
      status.textContent = 'Kod hatalı veya süresi doldu.';
      status.className = 'status error';
      return;
    }
    var body = await resp.json();
    localStorage.setItem('dos_session_token', body.session_token);
    localStorage.setItem('dos_user_email', pendingEmail);
    window.location.href = '/portal';
  } catch (err) {
    status.textContent = 'Bir şeyler ters gitti, tekrar deneyin.';
    status.className = 'status error';
  }
});

document.getElementById('resend-btn').addEventListener('click', function () {
  verifyForm.classList.add('hidden');
  requestForm.classList.remove('hidden');
  document.getElementById('verify-status').textContent = '';
});
</script>
</body>
</html>
